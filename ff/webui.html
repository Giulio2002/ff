<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formal Factory</title>
<style>
:root {
  --bg: #0d1117; --panel: #151b23; --panel2: #1b2330; --line: #2a3442; --text: #e6edf3; --dim: #8b98a8;
  --accent: #7c9cff; --good: #3fb950; --bad: #f85149; --warn: #d29922; --crit: #ff5d73; --high: #ff9f43;
  --med: #e3c75b; --low: #7d8a9c; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f6f8fa; --panel: #ffffff; --panel2: #f0f3f6; --line: #d8dee4; --text: #1f2328; --dim: #59636e;
    --accent: #3b5bdb; --good: #1a7f37; --bad: #cf222e; --warn: #9a6700; --crit: #c9184a; --high: #d9480f;
    --med: #9a6700; --low: #6e7781;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 18px; margin-bottom: 18px; }
h1 { font-size: 26px; margin: 0; letter-spacing: -0.02em; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 0 0 12px; font-weight: 600; }
.badge { font: 12px var(--mono); padding: 2px 8px; border: 1px solid var(--line); border-radius: 99px; color: var(--dim); }
.live { margin-left: auto; color: var(--dim); font-size: 13px; display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 var(--good); animation: pulse 2s infinite; }
.dot.stale { background: var(--bad); animation: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(63,185,80,.5) } 70% { box-shadow: 0 0 0 8px rgba(63,185,80,0) } 100% { box-shadow: 0 0 0 0 rgba(63,185,80,0) } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.grid { display: grid; gap: 14px; }
.cols-5 { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.cols-2 { grid-template-columns: 1.4fr 1fr; }
@media (max-width: 860px) { .cols-2 { grid-template-columns: 1fr; } }
.section { margin-top: 14px; }

/* phases */
.phases { display: flex; gap: 0; margin-bottom: 8px; }
.phase { flex: 1; position: relative; padding: 14px 10px 12px; text-align: center; color: var(--dim);
  border-top: 4px solid var(--line); font-weight: 600; text-transform: capitalize; }
.phase.done { color: var(--good); border-color: var(--good); }
.phase.now { color: var(--accent); border-color: var(--accent); }
.phase.now::after { content: "now"; position: absolute; top: -26px; left: 50%; transform: translateX(-50%);
  font-size: 11px; background: var(--accent); color: #fff; padding: 1px 8px; border-radius: 99px; text-transform: none; }
.phase small { display: block; font-weight: 400; font-size: 12px; color: var(--dim); }
.story { font-size: 17px; margin: 6px 2px 0; }
.alert { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, var(--panel)); margin-bottom: 14px; }

/* stat cards */
.stat .big { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
.stat .sub { color: var(--dim); font-size: 13px; margin-top: 4px; }
.bar { height: 6px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-top: 10px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); } .dim { color: var(--dim); }

/* chart */
svg text { fill: var(--dim); font: 11px var(--mono); }
.chart-note { color: var(--dim); font-size: 13px; margin-top: 8px; }

/* agents */
.agent { padding: 12px 0; border-top: 1px solid var(--line); }
.agent:first-of-type { border-top: 0; padding-top: 0; }
.agent b { font-weight: 600; }
.agent .t { color: var(--dim); font-size: 13px; }
.agent .note { margin-top: 6px; font-size: 13px; border-left: 3px solid var(--accent); padding-left: 10px; color: var(--text); }
.empty { color: var(--dim); font-style: italic; }

/* gates */
.squares { display: flex; flex-wrap: wrap; gap: 4px; }
.sq { width: 16px; height: 16px; border-radius: 4px; background: var(--good); }
.sq.red { background: var(--bad); opacity: .75; } .sq.running { background: var(--warn); animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .35 } }

/* audit */
.round { border-top: 1px solid var(--line); padding: 12px 0; }
.round:first-of-type { border-top: 0; padding-top: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.chip { font-size: 12px; padding: 1px 9px; border-radius: 99px; border: 1px solid var(--line); }
.chip.critical { color: var(--crit); border-color: var(--crit); } .chip.high { color: var(--high); border-color: var(--high); }
.chip.medium { color: var(--med); border-color: var(--med); } .chip.low { color: var(--low); }
details summary { cursor: pointer; color: var(--dim); font-size: 13px; }
.finding { display: grid; grid-template-columns: 70px 90px 1fr; gap: 8px; font-size: 13px; padding: 4px 0; }
.sev { font-weight: 600; text-transform: uppercase; font-size: 11px; padding-top: 2px; }
.sev.critical { color: var(--crit); } .sev.high { color: var(--high); } .sev.medium { color: var(--med); } .sev.low { color: var(--low); }

/* timeline */
.ev { display: grid; grid-template-columns: 74px 1fr; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
.ev:first-child { border-top: 0; }
.ev .when { color: var(--dim); font-size: 12px; padding-top: 2px; }
.ev .lbl { font-weight: 600; margin-right: 6px; }
.ev .lbl.good { color: var(--good); } .ev .lbl.bad { color: var(--bad); } .ev .lbl.acc { color: var(--accent); }
.ev .txt { color: var(--dim); }
.items { display: flex; flex-wrap: wrap; gap: 6px; }
.item { font: 12px var(--mono); padding: 2px 8px; border-radius: 6px; background: var(--panel2); }
.item.done { color: var(--good); } .item.blocked { color: var(--bad); } .item.running { color: var(--accent); }
.costrow { display: grid; grid-template-columns: 140px 1fr 70px; gap: 10px; align-items: center; font-size: 13px; margin: 6px 0; }
.costrow .bar { margin: 0; }
footer { color: var(--dim); font-size: 12px; margin-top: 28px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="project">Formal Factory</h1>
    <span class="badge" id="lang"></span>
    <span class="badge" id="main"></span>
    <span class="live"><span class="dot" id="dot"></span><span id="updated">connecting…</span></span>
  </header>

  <div id="alerts"></div>

  <div class="panel">
    <div class="phases" id="phases"></div>
    <p class="story" id="story"></p>
  </div>

  <div class="grid cols-5 section" id="stats"></div>

  <div class="grid cols-2 section">
    <div class="panel"><h2>Speed over time</h2><div id="chart"></div><div class="chart-note" id="chartnote"></div></div>
    <div class="panel"><h2>Working right now</h2><div id="agents"></div></div>
  </div>

  <div class="grid cols-2 section">
    <div class="panel"><h2>What happened</h2><div id="events"></div></div>
    <div>
      <div class="panel"><h2>Audit</h2><div id="audit"></div></div>
      <div class="panel section"><h2>Every change through the gate</h2><div class="squares" id="gates"></div>
        <div class="chart-note" id="gatenote"></div></div>
      <div class="panel section"><h2>Work items</h2><div class="items" id="backlog"></div></div>
      <div class="panel section"><h2>Spend by role</h2><div id="cost"></div></div>
    </div>
  </div>

  <footer>formal-factory · read-only view · refreshes every 5 s</footer>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function ago(ts, now) {
  if (!ts) return "";
  const s = Math.max(0, (now || Date.now() / 1000) - ts);
  if (s < 60) return Math.round(s) + "s ago";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 86400) return (s / 3600).toFixed(s < 36000 ? 1 : 0) + " h ago";
  return (s / 86400).toFixed(1) + " days ago";
}
function dur(s) {
  s = Math.max(0, s);
  if (s < 3600) return Math.round(s / 60) + " min";
  if (s < 86400) return (s / 3600).toFixed(1) + " h";
  return (s / 86400).toFixed(1) + " days";
}
const fmtn = v => v == null ? "–" : (v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2));
let UNIT = "";
const fmtx = v => v == null ? "–" : fmtn(v) + UNIT;

const PHASE_TEXT = {
  specify: "Agents are writing the specification. A human approves it before anything is built against it.",
  implement: "Agents are writing the program and proving each law of the contract.",
  optimize: "Everything is proved. Agents are now making it faster, one proved change at a time.",
  audit: "Proved and fast enough. Fresh auditors are trying to break it; real problems get fixed.",
  done: "Finished: fully proved, fast enough, and the auditors ran out of serious findings.",
  idle: "Idle.",
};

function render(st) {
  const now = st.now;
  UNIT = st.benchmark.unit || "";
  document.title = st.project + " · Formal Factory";
  $("project").textContent = st.project;
  $("lang").textContent = st.language;
  $("main").innerHTML = st.github ? `<a style="color:inherit" href="https://github.com/${esc(st.github)}">${esc(st.github)}</a> · main ${esc(st.main)}` : "main " + esc(st.main);

  // alerts
  let al = "";
  for (const d of st.decisions) al += `<div class="panel alert">⏸ Waiting for a human: ${esc(d.question)}</div>`;
  if (st.paused.length) al += `<div class="panel alert">Paused: ${esc(st.paused.join(", "))}</div>`;
  $("alerts").innerHTML = al;

  // phases
  const idx = st.phases.indexOf(st.phase);
  const sub = { specify: () => { const s = st.backlog.filter(b => b.loop === "specify"), d = s.filter(b => b.status === "done").length; return s.length ? `${d}/${s.length} parts` : ""; },
                implement: () => { const s = st.backlog.filter(b => b.loop !== "specify"), d = s.filter(b => b.status === "done").length; return s.length ? `${d}/${s.length} items` : ""; },
                optimize: () => st.benchmark.target != null ? `target ${fmtx(st.benchmark.target)}` : "",
                audit: () => st.audit.rounds.length ? `${st.audit.rounds.length} round${st.audit.rounds.length > 1 ? "s" : ""}` : "",
                done: () => "" };
  $("phases").innerHTML = st.phases.map((p, i) =>
    `<div class="phase ${i < idx || st.phase === "done" ? "done" : i === idx ? "now" : ""}">${i < idx || (st.phase === "done") ? "✓ " : ""}${p}<small>${esc((sub[p] || (() => ""))())}</small></div>`).join("");
  let story = PHASE_TEXT[st.phase] || "";
  if (st.phase === "audit" && st.audit.waiting) story += ` (Waiting for: ${esc(st.audit.waiting)}.)`;
  $("story").innerHTML = story;

  // stats
  const b = st.benchmark, gc = st.gate_counts;
  const impl = st.backlog.filter(x => x.loop !== "specify");
  const doneItems = impl.filter(x => x.status === "done").length;
  const rounds = st.audit.rounds, allF = rounds.flatMap(r => r.findings);
  const fixed = allF.filter(f => f.status === "fixed").length, documented = allF.filter(f => f.status === "documented").length;
  let speedCard = `<div class="big">${fmtx(b.current)}</div><div class="sub">current benchmark`;
  if (b.target != null) speedCard += ` · target ${fmtx(b.target)} ${b.at_target ? '<span class="good">✓ met</span>' : ""}`;
  speedCard += `</div>`;
  if (b.target != null && b.current != null) {
    const first = b.series.length ? b.series[0].value : b.current;
    const pct = b.direction === "lower" ? Math.min(100, Math.max(0, (first - b.current) / Math.max(1e-9, first - b.target) * 100))
                                        : Math.min(100, b.current / b.target * 100);
    speedCard += `<div class="bar"><i style="width:${b.at_target ? 100 : pct}%;background:${b.at_target ? "var(--good)" : "var(--accent)"}"></i></div>`;
  }
  const cards = [
    ["Proofs", `<div class="big">${doneItems}/${impl.length || 0}</div><div class="sub">contract items done</div>
      <div class="bar"><i style="width:${impl.length ? doneItems / impl.length * 100 : 0}%;background:var(--good)"></i></div>`],
    ["Speed", speedCard],
    ["Gate", `<div class="big"><span class="good">${gc.green || 0}</span> <span class="dim" style="font-size:18px">merged</span></div>
      <div class="sub">${gc.red || 0} rejected${gc.running ? ` · ${gc.running} checking now` : ""}</div>`],
    ["Audit", `<div class="big">${rounds.length}</div><div class="sub">round${rounds.length === 1 ? "" : "s"} · ${allF.length} findings · ${fixed} fixed · ${documented} not reachable</div>`],
    ["Spend", `<div class="big">$${Math.round(st.cost.total).toLocaleString()}</div><div class="sub">${st.started ? "over " + dur(now - st.started) : ""}</div>`],
  ];
  $("stats").innerHTML = cards.map(([t, h]) => `<div class="panel stat"><h2>${t}</h2>${h}</div>`).join("");

  // chart
  drawChart(b);

  // agents
  $("agents").innerHTML = st.running.length ? st.running.map(a => `
    <div class="agent"><b>${esc(a.doing)}</b>${a.subagent ? ' <span class="badge">subagent</span>' : ""}
      <span class="t"> · for ${dur(now - a.since)}</span>
      <div class="t">${esc(a.task)}</div>
      ${a.note ? `<div class="note">${esc(a.note)}</div>` : ""}</div>`).join("")
    : `<div class="empty">${st.phase === "done" ? "Nothing left to do." : "No agent is running right now."}</div>`;

  // events
  const cls = k => ["gate-green", "experiment-kept", "fixed", "item-done", "target-reached", "audit-done"].includes(k) ? "good"
    : ["gate-red", "fix-failed", "error", "launch-error", "item-blocked", "accounts-exhausted", "target-lost"].includes(k) ? "bad" : "acc";
  $("events").innerHTML = st.events.slice(0, 40).map(e =>
    `<div class="ev"><div class="when">${ago(e.ts, now)}</div><div><span class="lbl ${cls(e.kind)}">${esc(e.label)}</span><span class="txt">${esc(e.text)}</span></div></div>`).join("")
    || `<div class="empty">Nothing yet.</div>`;

  // audit
  const SEV = ["critical", "high", "medium", "low"];
  let au = rounds.length ? "" : `<div class="empty">${st.audit.waiting ? "Starts once " + esc(st.audit.waiting) : "Not started."}</div>`;
  for (const r of rounds.slice().reverse()) {
    const counts = SEV.map(s => [s, r.findings.filter(f => f.severity === s).length]).filter(([, n]) => n);
    const st2 = r.status === "done" ? `<span class="good">done</span>` : `<span class="warn">${esc(r.status)}</span>`;
    au += `<div class="round"><b>Round ${r.n}</b> · ${st2} <span class="dim">· ${r.findings.length} findings</span>
      <div class="chips">${counts.map(([s, n]) => `<span class="chip ${s}">${n} ${s}</span>`).join("")}</div>
      <details><summary>show findings</summary>${r.findings.map(f =>
        `<div class="finding"><span class="sev ${f.severity}">${esc(f.severity)}</span><span class="dim">${esc(f.status)}</span><span>${esc(f.title)}</span></div>`).join("")}</details></div>`;
  }
  if (st.audit.converged) au = `<p class="good" style="margin-top:0">✓ Converged after round ${esc(st.audit.converged)}: nothing reachable at ${esc(st.audit.converge_at)} or worse.</p>` + au;
  $("audit").innerHTML = au;

  // gates
  $("gates").innerHTML = st.gates.slice().reverse().map(g =>
    `<div class="sq ${g.status === "green" ? "" : g.status === "red" ? "red" : "running"}" title="#${g.id} ${esc(g.status)} · ${esc(g.who)}${g.reason ? " · " + esc(g.reason) : ""}"></div>`).join("");
  const lastGreen = st.gates.find(g => g.status === "green");
  $("gatenote").textContent = lastGreen ? `last merge ${ago(lastGreen.ended, now)} · red squares are changes the gate refused (most are re-tried and merged later)` : "";

  // backlog
  $("backlog").innerHTML = st.backlog.map(i => `<span class="item ${esc(i.status)}" title="${esc(i.status)}">${esc(i.item.replace(/^law:/, ""))}</span>`).join("")
    || `<span class="empty">none</span>`;

  // cost
  const max = Math.max(1, ...Object.values(st.cost.by_role));
  $("cost").innerHTML = Object.entries(st.cost.by_role).filter(([, v]) => v > 0).map(([k, v]) =>
    `<div class="costrow"><span>${esc(k.replace(/_/g, " "))}</span><div class="bar"><i style="width:${v / max * 100}%"></i></div><span class="dim">$${Math.round(v)}</span></div>`).join("");
}

function drawChart(b) {
  const pts = b.series;
  if (pts.length < 2) { $("chart").innerHTML = `<div class="empty">No measurements yet.</div>`; $("chartnote").textContent = ""; return; }
  const W = 640, H = 240, L = 44, R = 12, T = 12, B = 26;
  const t0 = pts[0].ts, t1 = pts[pts.length - 1].ts;
  const vals = pts.map(p => p.value).concat(b.target != null ? [b.target] : []);
  const useLog = Math.max(...vals) / Math.max(1e-9, Math.min(...vals)) > 20;
  const f = v => useLog ? Math.log10(v) : v;
  let lo = Math.min(...vals.map(f)), hi = Math.max(...vals.map(f));
  if (hi - lo < 1e-9) { hi += 1; lo -= 1; }
  const x = t => L + (t - t0) / Math.max(1, t1 - t0) * (W - L - R);
  const y = v => T + (hi - f(v)) / (hi - lo) * (H - T - B);
  let line = "", last = null;
  for (const p of pts) { line += (line ? " L" : "M") + x(p.ts).toFixed(1) + " " + y(p.value).toFixed(1); last = p; }
  const ticks = [];
  for (let i = 0; i <= 4; i++) { const fv = lo + (hi - lo) * i / 4; ticks.push(useLog ? Math.pow(10, fv) : fv); }
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="benchmark over time">`;
  for (const tv of ticks) svg += `<line x1="${L}" x2="${W - R}" y1="${y(tv)}" y2="${y(tv)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(tv) + 4}" text-anchor="end">${fmtx(tv)}</text>`;
  if (b.target != null) svg += `<line x1="${L}" x2="${W - R}" y1="${y(b.target)}" y2="${y(b.target)}" stroke="var(--good)" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W - R}" y="${y(b.target) - 5}" text-anchor="end" style="fill:var(--good)">target ${fmtx(b.target)}</text>`;
  svg += `<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;
  for (const p of pts) if (p.kind === "kept") svg += `<circle cx="${x(p.ts)}" cy="${y(p.value)}" r="3.5" fill="var(--accent)"><title>${esc(fmtx(p.value))} · ${esc(p.note || "")}</title></circle>`;
  svg += `<circle cx="${x(last.ts)}" cy="${y(last.value)}" r="5" fill="var(--good)"/>`;
  const d0 = new Date(t0 * 1000), d1 = new Date(t1 * 1000);
  const fd = d => d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  svg += `<text x="${L}" y="${H - 6}">${fd(d0)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${fd(d1)}</text></svg>`;
  $("chart").innerHTML = svg;
  $("chartnote").textContent = `benchmark, ${b.direction} is better${useLog ? " (log scale)" : ""} · ` +
    `${b.kept} of ${b.experiments} optimization experiments kept` + (b.references.length ? ` · reference: ${b.references.join(", ")}` : "");
}

let lastOk = 0;
async function tick() {
  try {
    const r = await fetch("state.json", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
    lastOk = Date.now();
    $("dot").classList.remove("stale");
  } catch (e) {
    $("dot").classList.add("stale");
  }
  $("updated").textContent = lastOk ? "updated " + Math.round((Date.now() - lastOk) / 1000) + "s ago" : "cannot reach the factory";
}
tick();
setInterval(tick, 5000);
</script>
</body>
</html>
