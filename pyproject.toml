[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "formal-factory"
version = "0.1.0"
description = "A software factory for formal programs: agents write generators, a checker keeps score, a gate guards main"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ff = "ff.cli:main"

[tool.setuptools.packages.find]
include = ["ff*"]

[tool.setuptools.package-data]
"ff.roles" = ["*.md"]
